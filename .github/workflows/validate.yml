name: Validate plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Build bundled local MCP bridge
        working-directory: bridge
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Validate and package
        run: |
          python scripts/package.py --openai-local --openai-skills-only
          python -m unittest discover -s tests -p test_submission_package.py -v
          python -m unittest discover -s tests -p test_skills_only_package.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: augelab-plugin-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  stdio-bridge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Build and test stdio bridge
        working-directory: bridge
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test setup without installing Studio
        shell: powershell
        run: .\tests\setup-windows.tests.ps1
  linux-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test Linux setup without installing Studio
        run: python -m unittest discover -s tests -p test_setup_linux.py -v
